<h2 mat-dialog-title>{{ 'reviews.farmerReview' | translate }}</h2>

<mat-dialog-content>
  <div class="review-content" *ngIf="!loading">
    <div class="farmer-info">
      <img
        [src]="farmerPhoto"
        class="farmer-avatar"
        [alt]="farmerName"
      />
      <h3>{{ farmerName }}</h3>
    </div>

    <div class="rating-section">
      <label>{{ 'reviews.rating' | translate }}</label>
      <div class="stars">
        <span
          *ngFor="let star of [1,2,3,4,5]"
          class="star"
          [class.active]="star <= rating">
          &#9733;
        </span>
      </div>
    </div>

    <div class="comment-section" *ngIf="comment">
      <label>{{ 'reviews.comment' | translate }}</label>
      <mat-form-field appearance="outline" class="w-100">
        <textarea
          matInput
          [value]="comment"
          readonly
          rows="4"
          style="resize: none;">
        </textarea>
      </mat-form-field>
    </div>

    <div class="no-review" *ngIf="rating === 0">
      <p>{{ 'reviews.noFarmerReview' | translate }}</p>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <mat-spinner diameter="30"></mat-spinner>
    <p>{{ 'reviews.loading' | translate }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="close()">{{ 'common.close' | translate }}</button>
</mat-dialog-actions>
